<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura simplificada do Docker</title>
  <desc id="desc">A CLI envia comandos via Docker API ao dockerd, que coordena containerd e runc, usando recursos do kernel Linux como namespaces e cgroups.</desc>
  <defs>
    <style>
      .bg { fill:#f7fafc } .ink { fill:#0f172a; font: 700 22px DejaVu Sans, Arial, sans-serif } .sub { fill:#475569; font: 15px DejaVu Sans, Arial, sans-serif } .heading { fill:#0f172a; font:700 18px DejaVu Sans, Arial, sans-serif }
      .chip { fill:#155e75 } .chiptext { fill:#fff; font:700 18px DejaVu Sans, Arial, sans-serif } .link { stroke:#64748b; stroke-width:3; fill:none }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="2"/></marker>
  </defs>
  <rect class="bg" x="1" y="1" width="1118" height="438" rx="18" stroke="#dce4ec" stroke-width="2"/>
  <text x="40" y="44" class="ink">Docker: do comando ao processo isolado</text>
  <text x="40" y="72" class="sub">Diagrama conceitual (Docker Engine no Linux)</text>

  <rect x="44" y="130" width="215" height="118" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="151" y="171" class="heading" text-anchor="middle">Docker CLI</text>
  <text x="151" y="200" class="sub" text-anchor="middle">docker run</text>
  <text x="151" y="222" class="sub" text-anchor="middle">docker build</text>

  <path class="link" d="M264 189 H326" marker-end="url(#arrow)"/>
  <text x="295" y="170" class="sub" text-anchor="middle">API</text>

  <rect x="336" y="116" width="252" height="145" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="462" y="154" class="heading" text-anchor="middle">Docker Engine</text>
  <text x="462" y="184" class="heading" text-anchor="middle">dockerd</text>
  <text x="462" y="210" class="sub" text-anchor="middle">Imagens · redes</text>
  <text x="462" y="232" class="sub" text-anchor="middle">Volumes · containers</text>

  <path class="link" d="M593 189 H644" marker-end="url(#arrow)"/>
  <rect x="654" y="133" width="190" height="112" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="749" y="177" class="heading" text-anchor="middle">containerd</text>
  <text x="749" y="203" class="sub" text-anchor="middle">Gerencia tarefas</text>
  <text x="749" y="224" class="sub" text-anchor="middle">e containers</text>

  <path class="link" d="M850 189 H900" marker-end="url(#arrow)"/>
  <rect x="910" y="144" width="164" height="91" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="992" y="180" class="heading" text-anchor="middle">runc</text>
  <text x="992" y="205" class="sub" text-anchor="middle">Cria processo</text>

  <path class="link" d="M992 239 V281" marker-end="url(#arrow)"/>
  <rect x="336" y="298" width="738" height="97" rx="14" fill="#0f172a"/>
  <text x="705" y="333" text-anchor="middle" style="fill:#fff;font:700 20px DejaVu Sans,Arial,sans-serif">Kernel Linux do host</text>
  <text x="705" y="364" text-anchor="middle" style="fill:#cbd5e1;font:16px DejaVu Sans,Arial,sans-serif">Namespaces (isolamento)  ·  cgroups (recursos)  ·  filesystem / rede</text>
  <text x="44" y="355" class="sub">Não é uma VM completa:</text>
  <text x="44" y="381" class="sub">o kernel é compartilhado.</text>
</svg>
